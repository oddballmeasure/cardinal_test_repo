name: http-e2e

on:
  push:
    branches:
      - main
      - cardinal/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  http-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
