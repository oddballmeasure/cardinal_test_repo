name: http-e2e

on:
  push:
    branches:
      - main
      - cardinal/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  http-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install 'playwright>=1.50,<2' 'pytest>=8,<10'
      - run: python -m playwright install --with-deps chromium
      - run: docker compose build --pull
      - run: python -m pytest -q tests
